<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taller 3-1</title>

    <style>

        body {

            font-family: Arial, sans-serif;

            background-color: #f0f0f0;

            margin: 20px;
        }

        h1 {

            color: #1e3a5f;
        }

        .contenedor {

            display: flex;

            gap: 20px;
        }

        canvas {

            background-color: white;

            border: 2px solid black;
        }

        .panel {

            width: 240px;

            background-color: white;

            padding: 15px;

            border-radius: 10px;
        }

        .panel input {

            width: 100%;

            margin-bottom: 10px;

            padding: 5px;
        }

        button {

            width: 100%;

            padding: 10px;

            margin-top: 5px;

            cursor: pointer;
        }

        .botones {

            display: flex;

            gap: 10px;
        }

    </style>

</head>

<body>

    <!-- Titulo principal -->
    <h1>TALLER 3-1</h1>

    <div class="contenedor">

        <!-- Canvas -->
        <canvas id="canvas" width="700" height="500"></canvas>

        <!-- Panel lateral -->
        <div class="panel">

            <h3>Ventana de recorte</h3>

            <label>Xmin</label>
            <input type="number" id="xmin" value="100">

            <label>Ymin</label>
            <input type="number" id="ymin" value="100">

            <label>Xmax</label>
            <input type="number" id="xmax" value="400">

            <label>Ymax</label>
            <input type="number" id="ymax" value="300">

            <button onclick="actualizarVentana()">

                Actualizar ventana

            </button>

            <hr>

            <div id="info"></div>

            <div class="botones">

                <button onclick="anteriorCaso()">

                    ◀

                </button>

                <button onclick="siguienteCaso()">

                    ▶

                </button>

            </div>

        </div>

    </div>

    <!-- Archivo JavaScript -->
    <script src="script.js"></script>

</body>

</html>
