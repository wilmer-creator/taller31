<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taller 3-1</title>

    <style>

        body {

            font-family: Arial, sans-serif;

            background-color: #f0f0f0;

            margin: 20px;
        }

        h1 {

            color: #1e3a5f;
        }

        .contenedor {

            display: flex;

            gap: 20px;
        }

        canvas {

            background-color: white;

            border: 2px solid black;
        }

        .panel {

            width: 220px;

            background-color: white;

            padding: 15px;

            border-radius: 10px;
        }

        button {

            width: 100%;

            margin-top: 10px;

            padding: 10px;

            cursor: pointer;
        }

    </style>

</head>

<body>

    <!-- Titulo principal -->
    <h1>TALLER 3-1</h1>

    <div class="contenedor">

        <!-- Canvas -->
        <canvas id="canvas" width="700" height="500"></canvas>

        <!-- Panel lateral -->
        <div class="panel">

            <h3>Informacion</h3>

            <div id="info"></div>

            <button onclick="siguienteCaso()">

                Siguiente caso

            </button>

        </div>

    </div>

    <!-- Archivo JavaScript -->
    <script src="script.js"></script>

</body>

</html>
